<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Scoot Sales — field sales order and retailer tracking for your team.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Scoot Sales">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Scoot Sales</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background: #FAFAF8;
    }

    flt-semantics-host,
    flt-semantics-host * {
      touch-action: pinch-zoom !important;
    }

    #dso-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFAF8;
      color: #2E2C28;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 9999;
    }

    #dso-loading.dso-loading-hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .dso-loading-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: min(88vw, 320px);
      animation: dsoScreenIn 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .dso-loading-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #5F5B53;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .dso-loading-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3A7D5C;
      animation: dsoBrandDot 2.6s ease-in-out infinite;
    }

    .dso-loading-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
    }

    .dso-loading-chart {
      width: 100%;
      height: auto;
    }

    .dso-loading-slow {
      margin: 0;
      min-height: 40px;
      color: #5F5B53;
      font-size: 14px;
      line-height: 1.4;
    }

    .dso-loading-bar {
      position: relative;
      width: 100%;
      height: 3px;
      overflow: hidden;
      border-radius: 2px;
      background: #E9E7E2;
    }

    .dso-loading-bar::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 30%;
      border-radius: 2px;
      background: linear-gradient(
        90deg,
        rgba(58, 125, 92, 0) 0%,
        #3A7D5C 50%,
        rgba(58, 125, 92, 0) 100%
      );
      animation: dsoShimmer 1.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .dso-loading-area {
      animation: dsoBreathe 4.5s ease-in-out infinite;
    }

    .dso-loading-line {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: dsoDraw 1.7s 250ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes dsoScreenIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dsoDraw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes dsoBreathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }

    @keyframes dsoShimmer {
      0% { transform: translateX(-130%); }
      100% { transform: translateX(430%); }
    }

    @keyframes dsoBrandDot {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
</head>
<body>
  <div id="dso-loading" aria-label="Loading Scoot Sales">
    <div class="dso-loading-shell">
      <div class="dso-loading-brand">
        <span class="dso-loading-dot"></span>
        <span>Scoot Sales</span>
      </div>

      <svg class="dso-loading-chart" viewBox="0 0 240 96" width="248" height="99" aria-hidden="true">
        <defs>
          <linearGradient id="dso-loading-area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3A7D5C" stop-opacity="0.16"></stop>
            <stop offset="100%" stop-color="#3A7D5C" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <line x1="6" y1="30" x2="234" y2="30" stroke="#ECEAE5" stroke-width="1"></line>
        <line x1="6" y1="56" x2="234" y2="56" stroke="#ECEAE5" stroke-width="1"></line>
        <line x1="6" y1="82" x2="234" y2="82" stroke="#ECEAE5" stroke-width="1"></line>
        <path class="dso-loading-area" d="M6,78 C40,74 54,58 84,60 C112,62 122,40 150,44 C182,49 196,22 234,30 L234,92 L6,92 Z" fill="url(#dso-loading-area)"></path>
        <path class="dso-loading-line" d="M6,78 C40,74 54,58 84,60 C112,62 122,40 150,44 C182,49 196,22 234,30" pathLength="100" fill="none" stroke="#3A7D5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle r="9" fill="#3A7D5C" opacity="0.14">
          <animateMotion dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.25 1" path="M6,78 C40,74 54,58 84,60 C112,62 122,40 150,44 C182,49 196,22 234,30"></animateMotion>
        </circle>
        <circle r="3.2" fill="#3A7D5C">
          <animateMotion dur="3.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.25 1" path="M6,78 C40,74 54,58 84,60 C112,62 122,40 150,44 C182,49 196,22 234,30"></animateMotion>
        </circle>
      </svg>

      <div class="dso-loading-status" role="status">
        <span id="dso-loading-status">Loading Scoot Sales</span>
        <div class="dso-loading-bar"></div>
        <p class="dso-loading-slow" id="dso-loading-slow"></p>
      </div>
    </div>
  </div>
  <script src="shell.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
