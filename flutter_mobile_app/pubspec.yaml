name: fmcg_sales
description: "FMCG Sales Management App"
publish_to: 'none'

version: 1.0.5+16

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  pdf: ^3.10.0
  printing: ^5.13.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.0.0
  geolocator: ^13.0.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.2.1
  mobile_scanner: ^6.0.0
  connectivity_plus: ^6.0.0
  battery_plus: ^7.1.2
  url_launcher: ^6.3.1
  http: ^1.2.0
  cryptography: ^2.9.0
  scoot_directory_client:
    path: ../packages/scoot_directory_client
  scoot_legal:
    path: ../packages/scoot_legal
  scoot_design:
    path: ../packages/scoot_design
  firebase_app_check: ^0.3.2+10
  local_auth: ^3.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Imported directly by the map-navigation integration test.
  url_launcher_platform_interface: ^2.3.2

  # Drives the app on a device or emulator for the field-flow checks that a
  # widget test cannot make: the assigned brief reaching the device, and the
  # screen surviving a real connectivity change.
  integration_test:
    sdk: flutter
  # The recovery driver drives the app test directly: the stock
  # integrationDriver() calls exit() as soon as the app test ends, which would
  # skip the kill, relaunch and exactly-once steps that follow it.
  flutter_driver:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - lib/images/ScootSales-icon.png

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/DMSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DMSans-Black.ttf
          weight: 900
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
