name: Verify Norman

on:
  push:
    branches: [Norman, main, next, Gestrain]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Choose the jobs this change can reach
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.reach.outputs.flutter }}
      e2e: ${{ steps.reach.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none

      - name: List what the changed files reach
        id: reach
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_reach.py >> "$GITHUB_OUTPUT"

  core:
    name: Guard, Python, Node, config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forecasting/requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r forecasting/requirements-dev.txt -r platform_service/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run repository guard
        run: python admin_dashboard/scripts/guard_ai1_constraints.py

      - name: Check no-paid-cloud defaults
        run: python scripts/check_no_paid_cloud_defaults.py

      - name: Check voice core imports
        run: python scripts/check_voice_core_imports.py

      - name: Check company project access stays behind company_access
        run: python scripts/check_plane_imports.py

      - name: Check legal text has one source and one version
        run: python scripts/check_legal_text.py

      - name: Check FAQ files match their one source
        run: python scripts/build_faq.py --check

      - name: Run Python tests
        timeout-minutes: 15
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q -x '\.venv' forecasting admin_dashboard/scripts

      - name: Check tracked JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files '*.js' ':!:*/web/flutter_bootstrap.js')

      - name: Run Node tests
        run: npm run test:node

      - name: Lint JavaScript with oxlint
        run: npx oxlint --deny-warnings .

      - name: Validate Firebase configuration JSON
        run: |
          python -m json.tool admin_dashboard/firebase.json > /dev/null
          python -m json.tool admin_dashboard/firestore.indexes.json > /dev/null
          npx --yes firebase-tools@15.20.0 --version

      - name: Check changed-line whitespace
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Check auth-path caches, shared broadcast streams and web CDN URLs
        run: python scripts/check_mistake_classes.py

  ai-runner-container:
    name: AI runner container safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build runner image
        run: docker build -f Dockerfile.ai-runner -t fyp-a-ai-runner:ci .

      - name: Verify non-root and secret-free image layout
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' fyp-a-ai-runner:ci)" = "app"
          docker run --rm --network none --entrypoint sh fyp-a-ai-runner:ci -c \
            'test "$(id -u)" != "0" &&
             ! find /app -type f \( -name "serviceAccountKey.json" -o -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .'

      - name: Verify safe defaults, logs, and exit codes
        shell: bash
        run: |
          docker run --rm --network none fyp-a-ai-runner:ci --help
          set +e
          output="$(docker run --rm --network none fyp-a-ai-runner:ci \
            --dry-run --service-account /not-mounted/serviceAccountKey.json 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '"event": "ai_runner_started"' <<<"$output"
          grep -q '"event": "ai_runner_failed"' <<<"$output"
          ! grep -q '/not-mounted/serviceAccountKey.json' <<<"$output"

  platform-service:
    name: Platform service (emulators, part ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            forecasting/requirements-dev.txt
            platform_service/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r forecasting/requirements-dev.txt -r platform_service/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run platform service suites against the Firestore and Auth emulators
        run: |
          files=$(ls platform_service/tests/test_*_emulator.py | sort | awk -v n=3 -v k="${{ matrix.shard }}" 'NR%n==k' | tr '\n' ' ')
          if [ "${{ matrix.shard }}" = "0" ]; then files="${files}forecasting/tests/test_insight_refresh_emulator.py"; fi
          echo "${files}"
          npx firebase emulators:exec --only firestore,auth --project demo-ci --config firebase.ci.json "V4_MEMBERSHIP_EMULATOR_PROJECT=demo-v4-membership-ci python -m pytest -q -p no:cacheprovider ${files}"

      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-service-emulator-log-${{ matrix.shard }}
          path: firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Audit Python requirements against the public advisory database
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r platform_service/requirements.txt -r forecasting/requirements.txt
          python -m pip_audit -r forecasting/requirements-ai-runner.txt

  secret-scan:
    name: Secret scan of the pushed commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.18.4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install the gitleaks binary and check its checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          rm "${archive}" checksums.txt

      - name: Scan the commits of this push or pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            range="-1 ${HEAD_SHA}"
          else
            range="${BASE_SHA}..${HEAD_SHA}"
          fi
          trusted_base="${BASE_SHA}"
          if [ -z "${trusted_base}" ] || [ "${trusted_base}" = "0000000000000000000000000000000000000000" ]; then
            trusted_base="${HEAD_SHA}~1"
          fi
          git show "${trusted_base}:.gitleaks.toml" > "${RUNNER_TEMP}/gitleaks.toml"
          ./gitleaks detect --source . --config "${RUNNER_TEMP}/gitleaks.toml" --redact --no-banner --verbose --log-opts "${range}"

  admin:
    name: Admin Flutter web
    needs: scope
    if: needs.scope.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true

      - name: Resolve dependencies
        working-directory: admin_dashboard
        run: flutter pub get

      - name: Test
        working-directory: admin_dashboard
        run: flutter test

      - name: Analyze
        working-directory: admin_dashboard
        run: flutter analyze

      - name: Build web
        working-directory: admin_dashboard
        run: flutter build web

  directory-client:
    name: Directory client package
    needs: scope
    if: needs.scope.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform_service/requirements.txt

      - name: Install platform service dependencies
        run: python -m pip install -r platform_service/requirements.txt

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true

      - name: Resolve dependencies
        working-directory: packages/scoot_directory_client
        run: dart pub get

      - name: Test
        working-directory: packages/scoot_directory_client
        run: dart test

  mobile:
    name: Mobile Flutter Android
    needs: scope
    if: needs.scope.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The APK build installs the NDK and CMake and compiles native code; the
      # runner's free disk ran out mid-build. Drop large preinstalled toolchains
      # this job never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.41.7"
          cache: true

      - name: Resolve dependencies
        working-directory: flutter_mobile_app
        run: flutter pub get

      - name: Test
        working-directory: flutter_mobile_app
        run: flutter test

      - name: Analyze
        working-directory: flutter_mobile_app
        run: flutter analyze

      # android/gradle.properties caps Metaspace at 256m, which D8 exhausts on a cold
      # Gradle cache; the daemon then spins instead of failing. User-home properties
      # override the project file, so raise the cap for CI only.
      - name: Give Gradle enough Metaspace
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError' >> ~/.gradle/gradle.properties

      # One ABI is enough to prove the app compiles, at a quarter of the native
      # build output.
      - name: Build debug APK
        timeout-minutes: 20
        working-directory: flutter_mobile_app
        run: |
          flutter build apk --debug --target-platform android-arm64
          df -h /

      - name: Check release task selection
        timeout-minutes: 10
        run: python3 scripts/test_release_signing_guard.py

  firestore-rules:
    name: Firestore rules emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            forecasting/requirements-dev.txt
            platform_service/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r forecasting/requirements-dev.txt -r platform_service/requirements.txt

      - name: Install test dependencies
        run: npm ci

      - name: Run Firestore access-invariant tests and the expression-budget guard
        run: npm run test:rules:emulator

  firestore-rules-budget:
    name: Firestore rules expression-budget headroom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      # npm ci installs the firebase-tools version pinned in package-lock.json,
      # the same one the firestore-rules job uses.
      - name: Install test dependencies
        run: npm ci

      # Replays the Android three-skip chain with a selected final stop, GPS
      # completion and the active/paused final-stop batches with padding in
      # front of every allow statement; fails if any no longer fits the
      # 1,000-expression limit. The full-suite job above runs it too, this job
      # fails fast and names the budget as the cause.
      - name: Check route-write expression headroom
        run: npm run test:rules:budget:emulator

  # The flows run on the shared dashboard and phone builds, split into shards so
  # no job nears its timeout. E2E_SHARD gives every job a share of the flow list;
  # the flows that need a different build or sign-in runner have their own jobs.
  e2e:
    name: End-to-end (shard ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/e2e-setup

      - name: Build both web apps against the emulators
        run: npm run e2e:build

      - name: Run end-to-end flows
        run: npm run e2e

      # The runner clears e2e/output when it starts, so write the run details
      # after it, then upload on every run so a green run keeps its evidence.
      - name: Record E2E run details
        if: always()
        run: |
          mkdir -p e2e/output
          {
            echo "commit: ${GITHUB_SHA}"
            echo "shard: ${E2E_SHARD}"
            echo "firebase target: ${E2E_FIREBASE_TARGET:-default (cos40005)}"
            echo "build defines: USE_FIREBASE_EMULATOR=true FIREBASE_EMULATOR_HOST=127.0.0.1 FIRESTORE_EMULATOR_PORT=8089 FIREBASE_AUTH_EMULATOR_PORT=9099 COPILOT_URL=http://127.0.0.1:18765${E2E_FIREBASE_TARGET:+ FIREBASE_TARGET=${E2E_FIREBASE_TARGET}}"
          } > e2e/output/RUN_INFO.txt

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-output-shard-${{ matrix.shard }}
          path: |
            e2e/output/
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7

  # The Control Centre signs in through the browser, so the Auth emulator must
  # sign tokens for the platform project. These flows use the Control Centre
  # build (lib/control_centre/main.dart) and the sign-in runner.
  e2e-control-centre:
    name: End-to-end (Control Centre sign-in, shard ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_ADMIN_BUILD: web_control_signin_e2e
      E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/e2e-setup

      - name: Build the Control Centre and the phone app against the emulators
        env:
          E2E_ADMIN_TARGET: lib/control_centre/main.dart
        run: npm run e2e:build

      - name: Run the Control Centre sign-in flows
        env:
          E2E_OUTPUT_TAG: signin
        run: npm run e2e:signin

      - name: Run the Control Centre part of the walkthrough
        if: matrix.shard == 1 && (success() || failure())
        env:
          E2E_SHARD: ""
          E2E_OUTPUT_TAG: walkthrough-control
          E2E_FILTER: walkthrough
          WALKTHROUGH_CONTROL_BUILD: web_control_signin_e2e
        run: npm run e2e:signin

      - name: Record E2E run details
        if: always()
        run: |
          mkdir -p e2e/output
          {
            echo "commit: ${GITHUB_SHA}"
            echo "runner: sign-in (emulator project demo-scoot-platform)"
            echo "shard: ${E2E_SHARD}"
            echo "admin build: ${E2E_ADMIN_BUILD} from lib/control_centre/main.dart"
          } > e2e/output/RUN_INFO.txt

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-control-centre-output-shard-${{ matrix.shard }}
          path: |
            e2e/output/
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7

  # The company routing flow needs the builds that look the company up through
  # the platform service (E2E_TENANT_ROUTING=1, output folders web_e2e_v4).
  e2e-company-routing:
    name: End-to-end (company routing)
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_TENANT_ROUTING: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/e2e-setup

      - name: Build both web apps with company routing
        run: npm run e2e:build

      - name: Run the company routing flow
        run: npm run e2e

      - name: Record E2E run details
        if: always()
        run: |
          mkdir -p e2e/output
          {
            echo "commit: ${GITHUB_SHA}"
            echo "runner: company routing (E2E_TENANT_ROUTING=1, builds web_e2e_v4)"
          } > e2e/output/RUN_INFO.txt

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-company-routing-output
          path: |
            e2e/output/
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7

  # The basic edition is a build switch (EDITION=basic), so it needs its own web
  # build. It runs beside the shards above and runs only the edition flow.
  e2e-basic:
    name: End-to-end (basic edition)
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_EDITION: basic
      E2E_FILTER: edition_basic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: ./.github/actions/e2e-setup

      - name: Build both web apps as the basic edition
        run: npm run e2e:build

      - name: Run the basic edition flow
        run: npm run e2e

      # The runner clears e2e/output when it starts, so write the run details
      # after it, then upload on every run.
      - name: Record E2E run details
        if: always()
        run: |
          mkdir -p e2e/output
          {
            echo "commit: ${GITHUB_SHA}"
            echo "edition: basic"
            echo "build defines: EDITION=basic USE_FIREBASE_EMULATOR=true FIREBASE_EMULATOR_HOST=127.0.0.1 FIRESTORE_EMULATOR_PORT=8089 FIREBASE_AUTH_EMULATOR_PORT=9099 COPILOT_URL=http://127.0.0.1:18765"
          } > e2e/output/RUN_INFO.txt

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-basic-output
          path: |
            e2e/output/
            firestore-debug.log
          if-no-files-found: ignore
          retention-days: 7
