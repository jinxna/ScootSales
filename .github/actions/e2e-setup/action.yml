name: End-to-end setup
description: Install the toolchain and dependencies the end-to-end flows need.

inputs:
  flutter:
    description: Install Flutter. Jobs that restore their web builds do not need it.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: platform_service/requirements.txt

    - name: Install platform service dependencies
      shell: bash
      run: python -m pip install -r platform_service/requirements.txt

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "20"
        cache: npm

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      if: inputs.flutter == 'true'
      with:
        channel: stable
        flutter-version: "3.41.7"
        cache: true

    - name: Install Node dependencies
      shell: bash
      run: npm ci

    - name: Restore the Playwright browser
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Chromium for Playwright
      shell: bash
      run: npx playwright-core install --with-deps chromium
