name: scoot_design_gallery
description: Gallery of every scoot_design widget in each state.
publish_to: 'none'

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  scoot_design:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: ../assets/fonts/inter/Inter-Regular.ttf
